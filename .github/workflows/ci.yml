name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Package .vsix (validate the manifest builds cleanly)
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roam-vsix
          path: roam.vsix
          if-no-files-found: error
